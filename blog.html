<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Adrian Copa | Operaciones para pymes</title>
  <meta name="description" content="Publicaciones de Adrian Copa sobre operaciones, costos, calidad, inventarios y liderazgo para pymes e industrias de consumo masivo." />
  <link rel="canonical" href="https://adriancopa.github.io/blog.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Adrian Copa" />
  <meta property="og:url" content="https://adriancopa.github.io/blog.html" />
  <meta property="og:title" content="Blog · Adrian Copa | Operaciones para pymes" />
  <meta property="og:description" content="146 publicaciones sobre costos, calidad, inventarios y liderazgo para pymes e industrias de consumo masivo." />
  <meta property="og:image" content="https://adriancopa.github.io/assets/foto-perfil.jpg" />
  <meta property="og:image:width" content="640" />
  <meta property="og:image:height" content="640" />
  <meta property="og:locale" content="es_BO" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/foto-perfil.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f6f5f2; --bg-2: #eeece7; --card: #fff; --ink: #0f1b2d; --ink-2: #26344a; --muted: #5b6472; --line: #e3e1db; --accent: #e0622f; --accent-soft: #fbe9e0; --head: 'Manrope', system-ui, sans-serif; --sans: 'Inter', system-ui, sans-serif; --ease: cubic-bezier(.2,.7,.2,1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    h1, h2, h3 { font-family: var(--head); letter-spacing: -.025em; line-height: 1.12; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(246,245,242,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .brand b { display: block; font-family: var(--head); font-weight: 800; font-size: 15px; line-height: 1.2; }
    .brand small { font-size: 12px; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-family: var(--head); font-weight: 700; font-size: 14.5px; transition: transform .25s var(--ease), background .2s; white-space: nowrap; }
    .btn:hover { transform: translateY(-2px); }
    .btn svg { width: 17px; height: 17px; }
    .btn-li { background: #0a66c2; color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--card); border: 1px solid var(--line); }
    .hero { padding: 64px 0 36px; }
    .eyebrow { font-family: var(--head); font-weight: 700; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .hero h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 800; margin: 10px 0 12px; }
    .hero p { color: var(--muted); font-size: 17px; max-width: 620px; }
    .hero .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 0; }
    .tags button { font: 700 13px var(--head); padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; }
    .tags button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 30px 0 90px; }
    .post { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--card); transition: transform .35s var(--ease), box-shadow .35s; cursor: pointer; }
    .post:hover { transform: translateY(-6px); box-shadow: 0 30px 60px -30px rgba(15,27,45,.4); }
    .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--ink); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
    .src { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
    .src span { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.92); }
    .src .li { background: #0a66c2; color: #fff; } .src .tt { background: #111; color: #fff; }
    .pb { padding: 20px 22px 22px; }
    time { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .post h3 { font-size: 19px; font-weight: 800; margin: 6px 0 8px; }
    .post p { font-size: 14.5px; color: var(--muted); }
    /* article view */
    article.full { max-width: 760px; margin: 0 auto; padding: 40px 0 90px; }
    .back { display: inline-flex; gap: 6px; font-family: var(--head); font-weight: 700; color: var(--accent); margin-bottom: 22px; cursor: pointer; }
    article.full h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; margin: 8px 0 14px; }
    article.full .lead { font-size: 19px; color: var(--ink-2); margin-bottom: 22px; }
    article.full .body p { font-size: 17px; color: var(--ink-2); margin-bottom: 16px; }
    .embeds { display: grid; gap: 22px; margin: 30px 0; justify-items: center; }
    .embeds iframe { border: 0; border-radius: 14px; background: #fff; box-shadow: 0 20px 40px -24px rgba(15,27,45,.4); }
    .tt-frame { width: min(340px, 100%); aspect-ratio: 9 / 16; }
    .li-frame { width: 100%; max-width: 560px; height: 620px; }
    .author { display: flex; align-items: center; gap: 14px; padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-top: 30px; flex-wrap: wrap; }
    .author img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
    .author div { flex: 1; min-width: 180px; }
    .author b { font-family: var(--head); font-weight: 800; display: block; }
    .author span { font-size: 14px; color: var(--muted); }
    .cover { position: absolute; inset: 0; padding: 18px 20px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22), transparent 55%), linear-gradient(150deg, var(--c1), var(--c2)); }
    .cover::before { content: '“'; position: absolute; right: 16px; top: -18px; font: 800 120px/1 var(--head); opacity: .18; }
    .cover b { font-family: var(--head); font-weight: 800; font-size: 17px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 26px; }
    .search { flex: 1; min-width: 220px; max-width: 360px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); font: 500 15px var(--sans); background: var(--card); }
    .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .tags button small { opacity: .6; margin-left: 4px; }
    .count { font-size: 14px; color: var(--muted); }
    .more { display: flex; justify-content: center; padding-bottom: 90px; }
    .grid { padding-bottom: 30px; }
    .seg-pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; background: var(--c1); margin-left: 8px; vertical-align: middle; }
    footer { border-top: 1px solid var(--line); padding: 26px 0; font-size: 13px; color: var(--muted); text-align: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; }
    .visits { display: inline-flex; align-items: center; gap: 6px; }
    .visits svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
    .visits b { font-weight: 700; color: var(--ink); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .wrap { padding: 0 16px; } .grid { grid-template-columns: 1fr; } .nav .btn-li span { display: none; } .hero { padding-top: 36px; } }
  </style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html"><img src="assets/foto-perfil.jpg" alt="" width="36" height="36" /><div><b>Adrian Copa</b><small>Blog</small></div></a>
    <div style="display:flex; gap:8px">
      <a class="btn btn-ghost" href="index.html">← Portafolio</a>
      <a class="btn btn-li" href="https://www.linkedin.com/in/adrian-copa-jara" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg><span>Seguir</span></a>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer>
  <span>© 2026 Adrian Copa · Transformador de Operaciones Industriales · <a href="index.html#contacto" style="color:var(--accent);font-weight:600">Hablemos</a></span>
  <span class="visits" title="Visitas a esta página, contadas automáticamente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><b id="visitsCount">2.482</b> visitas</span>
</footer>

<script>
  /* ---------- automatic visit counter (shared with index.html) ---------- */
  (function () {
    const el = document.getElementById('visitsCount');
    if (!el) return;
    const already = sessionStorage.getItem('adriancopa_visited');
    const ep = already ? 'get' : 'hit';
    fetch(`https://abacus.jasoncameron.dev/${ep}/adriancopa-portfolio/visitas`)
      .then((r) => r.json())
      .then((d) => { el.textContent = Number(d.value).toLocaleString('es-BO'); sessionStorage.setItem('adriancopa_visited', '1'); })
      .catch(() => {});
  })();

  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const fmt = (s) => { const [y, m, d] = s.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Accepts any LinkedIn post URL and returns its embeddable URN (activity / share / ugcPost).
  const liUrn = (url) => { const m = String(url || '').match(/(activity|share|ugcPost)[:-](\d{15,20})/); return m ? `urn:li:${m[1]}:${m[2]}` : null; };
  const SEG = {
    'Costos y rentabilidad': ['#e0622f', '#9a3412'], 'Inventarios y logística': ['#14a394', '#0f5f57'],
    'Calidad': ['#1f9d57', '#14532d'], 'Producción y mejora continua': ['#2f6fe0', '#1e3a8a'],
    'Planificación, datos e IA': ['#7a3fc9', '#3b1f6b'], 'Liderazgo y equipos': ['#d97706', '#7c3a06'],
    'Carrera profesional': ['#db2777', '#831843'], 'Pymes y emprendimiento': ['#26344a', '#0f1b2d'],
  };
  const segOf = (p) => (p.etiquetas || [])[0] || 'Pymes y emprendimiento';
  const colors = (p) => SEG[segOf(p)] || ['#26344a', '#0f1b2d'];
  const media = (p) => {
    const img = p.imagen || (p.tiktok ? `assets/tiktok/${p.tiktok}.jpg` : '');
    if (img) return `<img src="${esc(img)}" alt="" loading="lazy" />`;
    const [c1, c2] = colors(p);
    return `<div class="cover" style="--c1:${c1};--c2:${c2}"><b>${esc(p.titulo)}</b></div>`;
  };
  const app = document.getElementById('app');
  let POSTS = [], tag = new URLSearchParams(location.search).get('tema') || 'Todas', q = '', limit = 12;

  function list() {
    document.title = 'Blog · Adrian Copa | Operaciones para pymes';
    const counts = {}; POSTS.forEach((p) => { const s = segOf(p); counts[s] = (counts[s] || 0) + 1; });
    const segs = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    app.innerHTML = `
      <section class="hero"><span class="eyebrow">Blog · ${POSTS.length} publicaciones</span><h1>Operaciones que venden más y gastan menos.</h1>
        <p>Todo lo que publico en LinkedIn y TikTok sobre costos, calidad, inventarios y liderazgo, organizado por tema.</p>
        <div class="actions"><a class="btn btn-primary" href="https://wa.me/59175971526?text=Hola%20Adrian%2C%20le%C3%AD%20tu%20blog%20y%20quiero%20conversar." target="_blank" rel="noopener">Conversemos 15 min →</a><a class="btn btn-ghost" href="https://www.tiktok.com/@modo_fabrica" target="_blank" rel="noopener">TikTok @modo_fabrica</a></div>
        <div class="tags">${['Todas', ...segs].map((t) => `<button class="${t === tag ? 'on' : ''}" data-tag="${esc(t)}">${esc(t)}<small>${t === 'Todas' ? POSTS.length : counts[t]}</small></button>`).join('')}</div>
        <div class="tools"><input class="search" type="search" placeholder="Buscar: inventario, liderazgo, costos…" value="${esc(q)}" aria-label="Buscar publicaciones" /><span class="count"></span></div>
      </section>
      <div class="grid"></div><div class="more"></div>`;
    app.querySelectorAll('.tags button').forEach((b) => b.onclick = () => { tag = b.dataset.tag; limit = 12; list(); });
    const input = app.querySelector('.search');
    input.oninput = () => { q = input.value; limit = 12; renderGrid(); };
    renderGrid();
  }

  function renderGrid() {
    const nq = q.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    const shown = POSTS.filter((p) => (tag === 'Todas' || (p.etiquetas || []).includes(tag)) &&
      (!nq || `${p.titulo} ${p.resumen} ${(p.cuerpo || []).join(' ')}`.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().includes(nq)));
    app.querySelector('.count').textContent = `${shown.length} resultado${shown.length === 1 ? '' : 's'}`;
    app.querySelector('.grid').innerHTML = shown.slice(0, limit).map((p) => `
        <a class="post" href="#${esc(p.slug)}">
          <div class="thumb">${media(p)}<div class="src">${p.linkedin ? '<span class="li">LinkedIn</span>' : ''}${p.tiktok ? '<span class="tt">TikTok</span>' : ''}</div></div>
          <div class="pb"><time>${fmt(p.fecha)}</time><span class="seg-pill" style="--c1:${colors(p)[0]}">${esc(segOf(p))}</span><h3>${esc(p.titulo)}</h3><p>${esc(p.resumen)}</p></div>
        </a>`).join('') || '<p style="grid-column:1/-1;color:var(--muted)">No hay publicaciones con ese criterio.</p>';
    const more = app.querySelector('.more');
    more.innerHTML = shown.length > limit ? `<button class="btn btn-primary">Ver más publicaciones (${shown.length - limit}) ↓</button>` : '';
    if (more.firstChild) more.firstChild.onclick = () => { limit += 12; renderGrid(); };
  }

  function article(p) {
    document.title = `${p.titulo} · Adrian Copa`;
    const urn = liUrn(p.linkedin);
    app.innerHTML = `
      <article class="full">
        <a class="back" href="#">← Todas las publicaciones</a>
        <time>${fmt(p.fecha)}</time>
        <h1>${esc(p.titulo)}</h1>
        ${p.fuente === 'linkedin' ? '' : `<p class="lead">${esc(p.resumen)}</p>`}
        <div class="body">${(p.cuerpo || []).map((t) => `<p>${esc(t)}</p>`).join('')}</div>
        <div class="embeds">
          ${p.tiktok ? `<iframe class="tt-frame" src="https://www.tiktok.com/player/v1/${esc(p.tiktok)}?music_info=0&description=0&rel=0" title="Video en TikTok" allow="encrypted-media; fullscreen" allowfullscreen loading="lazy"></iframe>` : ''}
        </div>
        ${p.linkedin ? `<p style="text-align:center"><a class="btn btn-li" href="${esc(p.linkedin)}" target="_blank" rel="noopener">Ver y comentar en LinkedIn →</a></p>` : ''}
        <div class="author"><img src="assets/foto-perfil.jpg" alt="" width="56" height="56" /><div><b>Adrian Copa</b><span>Transformador de Operaciones Industriales · Transformo procesos ineficientes en resultados medibles.</span></div><a class="btn btn-primary" href="index.html#contacto">Hablemos →</a></div>
      </article>`;
    scrollTo(0, 0);
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const p = POSTS.find((x) => x.slug === slug);
    p ? article(p) : list();
  }

  fetch('data/posts.json', { cache: 'no-cache' }).then((r) => r.json()).then((posts) => {
    POSTS = posts.sort((a, b) => b.fecha.localeCompare(a.fecha));
    route();
  }).catch(() => { app.innerHTML = '<p style="padding:60px 0">No se pudieron cargar las publicaciones.</p>'; });
  addEventListener('hashchange', route);
</script>
</body>
</html>
